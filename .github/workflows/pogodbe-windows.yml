name: Pregled pogodb - Windows build

on:
  workflow_dispatch:
  push:
    paths: ["pogodbe/**"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pogodbe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract
        run: choco install tesseract -y --no-progress
      - name: Testi
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests
      - name: Build
        run: ./build_windows.ps1
        shell: pwsh
      - name: Smoke test (OCR iz paketa)
        shell: pwsh
        run: |
          & "dist\PregledPogodb\tesseract\tesseract.exe" --list-langs
      - uses: actions/upload-artifact@v4
        with:
          name: PregledPogodb-windows
          path: pogodbe/dist/PregledPogodb-windows.zip
