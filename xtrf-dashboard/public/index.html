<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8" />
  <title>XTRF Dashboard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="error-banner" id="error-banner"></div>

  <div class="stage" id="stage">
    <div class="clock" id="clock"></div>
    <img class="logo" src="/amidas-logo.svg" alt="Amidas" />
    <div class="title" id="date"></div>

    <div class="grid">
      <div class="section">
        <div class="section-label">Promet danes</div>
        <div class="card-row" id="agreed-cards"></div>
      </div>
      <div class="section">
        <div class="section-label">Promet ta teden</div>
        <div class="card-row" id="agreed-week-cards"></div>
        <div class="rates-note" id="week-rates-note"></div>
      </div>
      <div class="section">
        <div class="section-label">Pla&#269;ani ra&#269;uni danes</div>
        <div class="card-row" id="paid-cards"></div>
        <div class="rates-note" id="rates-note"></div>
      </div>
      <div class="section">
        <div class="section-label">Pla&#269;ani ra&#269;uni ta teden</div>
        <div class="card-row" id="paid-week-cards"></div>
        <div class="rates-note" id="paid-week-rates-note"></div>
      </div>
      <div class="section"><div class="card-row" id="ytd-cell-5"></div></div>
      <div class="section"><div class="card-row" id="ytd-cell-6"></div></div>
      <div class="section-label ytd-label" id="ytd-label">YTD</div>
      <div class="section"><div class="card-row" id="ytd-cell-1"></div></div>
      <div class="section"><div class="card-row" id="ytd-cell-2"></div></div>
      <div class="section"><div class="card-row" id="ytd-cell-3"></div></div>
      <div class="section"><div class="card-row" id="ytd-cell-4"></div></div>
      <div class="section"><div class="card-row" id="ytd-cell-7"></div></div>
      <div class="section"><div class="card-row" id="ytd-cell-8"></div></div>
    </div>

    <div class="footer" id="footer"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
